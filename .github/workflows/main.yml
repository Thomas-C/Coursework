name: A workflow for our Population Report App
on: push

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run unit tests
        run:  mvn "-Dtest=CapitalCityTest,CountryReportTest" test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      -  name: checkout
         uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start database
        run: docker compose up -d --build db

      - name: Run integration tests
        run: mvn -Dtest=ReportIntegrationTest test

      - name: Stop database
        if: always()
        run : docker compose down
  build:
    name: Build Run in Docker and Deploy Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      -  name: Checkout
         uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package and run docker compose
        run: | 
            mvn package -DskipTests
            docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Publish Github Release
        if: github.ref == 'refs/heads/master'
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "latest"
          files: |
            ./target/*.jar

      - name: Stop containers
        if: always()
        run: docker compose down