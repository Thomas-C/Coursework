name: A workflow for my Reporting System
on: push

jobs:
  build:
    name: Reporting System action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Package with Maven
        run: mvn --batch-mode clean package
      - name: Build Docker Image
        run: docker build -t coursework-app .
      - name: Run application
        run: docker run --rm coursework-app

