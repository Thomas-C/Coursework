name: A workflow for our Population Report App
on: push

jobs:
  build:
    name: Run Docker Image
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn package
      - name: Start database
        run: docker compose up -d --build db
      - name: Run reports with N supplied automatically
        run: docker compose run --build --rm -T app 5
      - name: Stop containers
        if: always()
        run: docker compose down